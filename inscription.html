<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inscription Artisan - 50 places Bénin</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
body{background:#080808;color:white;padding:20px}
.box{max-width:450px;margin:0 auto;background:#151515;border:1px solid #333;border-radius:18px;padding:25px}
h1{color:#FFC107;text-align:center;font-size:22px}
.sub{text-align:center;color:#25D366;font-weight:900;margin:8px 0 5px}
.counter{text-align:center;background:rgba(255,193,7,0.1);border:1px solid #FFC107;padding:10px;border-radius:12px;margin:12px 0;color:#FFC107;font-weight:900;font-size:13px}
label{color:#aaa;font-size:13px;margin:14px 0 6px;display:block}
input,select,textarea{width:100%;padding:14px;border-radius:10px;border:1px solid #333;background:#080808;color:white;font-size:14px;outline:none}
input:focus,select:focus,textarea:focus{border-color:#FFC107}
.btn{width:100%;padding:16px;background:#FFC107;color:black;border:none;border-radius:12px;font-weight:900;font-size:16px;margin-top:20px;cursor:pointer}
.back{display:block;text-align:center;color:#666;text-decoration:none;margin-top:15px;font-size:13px}
.ok{background:#25D366;color:white;padding:14px;border-radius:10px;text-align:center;display:none;margin-bottom:12px;font-weight:900}
</style>
</head>
<body>
<div class="box">
<h1>👷 Inscription Artisan Bénin 🇧🇯</h1>
<div class="sub">✅ 0% COMMISSION • GRATUIT</div>
<div class="counter">🟢 <span id="place">50</span> artisans déjà inscrits • Il reste <span id="rest">10</span> places ce mois</div>
<div id="ok" class="ok">✅ Inscription envoyée ! Tu es le artisan N°<span id="num">51</span> ! On t'ajoute au site.</div>

<label>Ton nom complet *</label>
<input id="nom" placeholder="Ex: Koffi Mensah">
<label>Téléphone WhatsApp *</label>
<input id="tel" placeholder="Ex: 97 00 00 00">
<label>Quartier *</label>
<input id="quartier" placeholder="Ex: Godomey, Fidjrossè, Calavi...">
<label>Ton métier * (parmi 60)</label>
<select id="metier">
<option>Électricien Bâtiment</option><option>Frigoriste / Clim</option><option>Plombier</option><option>Maçon</option><option>Carreleur</option><option>Peintre</option><option>Menuisier Bois</option><option>Menuisier Alu</option><option>Soudeur</option><option>Vitrier</option><option>Staffeur</option><option>Mécanicien Auto</option><option>Mécanicien Moto</option><option>Vulcanisateur</option><option>Serrurier</option><option>Informaticien</option><option>Électronicien</option><option>Couturier</option><option>Coiffeuse</option><option>Barbier</option><option>Tapissier</option><option>Photographe</option><option>Traiteur / Cuisinier</option><option>Femme de ménage</option><option>Jardinier</option><option>Décorateur Event</option><option>Foreur d'eau</option><option>Solaire</option><option>Caméra Sécurité</option><option>Autre (60 métiers)</option>
</select>
<label>Expérience</label>
<input id="exp" placeholder="Ex: 5 ans d'expérience">
<label>Message</label>
<textarea id="msg" rows="3" placeholder="Ex: Je suis disponible 7j/7 à Calavi"></textarea>

<button class="btn" onclick="envoyer()">🔥 REJOINDRE LES 50 ARTISANS - GRATUIT</button>
<a class="back" href="index.html">← Retour au site 60 métiers</a>
</div>

<script>
// AFFICHE COMPTEUR 50
let base = 50;
let saved = parseInt(localStorage.getItem('artisan_count_229')||'50');
document.getElementById('place').textContent = saved;
document.getElementById('rest').textContent = 60 - saved;
document.getElementById('num').textContent = saved+1;

function envoyer(){
  let nom=document.getElementById('nom').value;
  let tel=document.getElementById('tel').value;
  if(!nom||!tel){alert('Remplis nom + téléphone');return;}

  // 1. AUGMENTE LE COMPTEUR 50 -> 51
  let current = parseInt(localStorage.getItem('artisan_count_229')||'50');
  let next = current+1;
  localStorage.setItem('artisan_count_229', next);

  // 2. AFFICHE SUCCÈS
  document.getElementById('ok').style.display='block';
  document.getElementById('num').textContent = next;
  document.getElementById('place').textContent = next;

  // 3. ENVOIE SUR TON WHATSAPP + EMAIL
  let metier=document.getElementById('metier').value;
  let quartier=document.getElementById('quartier').value;
  let txt = `NOUVEL ARTISAN BÉNIN N°${next} 🇧🇯%0A%0ANom: ${nom}%0ATel: ${tel}%0AMétier: ${metier}%0AQuartier: ${quartier}%0AExp: ${document.getElementById('exp').value}%0A%0ACompteur site: ${next} artisans`;
  
  setTimeout(()=>{
    window.open(`https://wa.me/22997000000?text=${txt}`,'_blank');
    // Email
    window.location.href=`mailto:pascalahohonon2@gmail.com?subject=Artisan N°${next} - ${metier} - ${nom}&body=${txt.replace(/%0A/g,'\n')}`;
  },800);
}
</script>
</body>
</html>
